name: VahanGrid CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Build (Zero-Cost CI)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: vahangrid_ci
          POSTGRES_USER: vahangrid_user
          POSTGRES_PASSWORD: ci_test_password_for_isolated_runner_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Create CI .env
        working-directory: backend
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://vahangrid_user:ci_test_password_for_isolated_runner_only@localhost:5432/vahangrid_ci' \
            'JWT_SECRET=ci_jwt_secret_must_be_minimum_32_characters_long_random_hex' \
            'JWT_EXPIRES_IN=7d' \
            'NODE_ENV=development' \
            'PORT=3001' \
            'PAYMENT_KEY_ID=rzp_test_ci' \
            'PAYMENT_KEY_SECRET=ci_test_payment_secret' \
            'PAYMENT_WEBHOOK_SECRET=ci_test_webhook_secret' \
            'FRONTEND_URL=http://localhost:5173' \
            > .env

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://vahangrid_user:ci_test_password_for_isolated_runner_only@localhost:5432/vahangrid_ci
        run: node src/scripts/migrate.js "$DATABASE_URL"

      - name: Start Backend API & OCPP Server
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: 3001
          DATABASE_URL: postgresql://vahangrid_user:ci_test_password_for_isolated_runner_only@localhost:5432/vahangrid_ci
          JWT_SECRET: ci_jwt_secret_must_be_minimum_32_characters_long_random_hex
          PAYMENT_KEY_ID: rzp_test_ci
          PAYMENT_KEY_SECRET: ci_test_payment_secret
          PAYMENT_WEBHOOK_SECRET: ci_test_webhook_secret
        run: |
          node src/server.js &
          # Wait up to 30 seconds for health check
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3001/health/readiness | grep -q "ready"; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Run Phase 5G Hardening Suite
        working-directory: backend
        run: npm run test:phase5g

      - name: Run Phase 5F Staging Integration Suite
        working-directory: backend
        run: npm run test:phase5f

      - name: Run Phase 5E Remote Staging Suite
        working-directory: backend
        run: npm run test:phase5e

      - name: Run Phase 5D Blocker Remediation Suite
        working-directory: backend
        run: node src/scripts/test_phase5d.js

      - name: Run Phase 4F Platform Reliability Suite
        working-directory: backend
        run: node src/scripts/test_phase4f.js

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose Manifest
        run: docker compose -f docker-compose.staging.yml config
